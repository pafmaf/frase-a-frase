<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Learn practical Spanish and European Portuguese sentence by sentence: audio, spaced repetition, a skill tree of real-life scenes.">
<meta name="theme-color" content="#E8EDFB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1330" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Frase a Frase">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Frase a Frase</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<div class="app" id="app"></div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<canvas id="confetti" hidden></canvas>

<noscript>Frase a Frase needs JavaScript.</noscript>
<script src="js/content.js"></script>
<script>
/* Boot: load the content first, then the app scripts in order. */
const loadScript=src=>new Promise((ok,fail)=>{const s=document.createElement("script");s.src=src;s.async=false;s.onload=ok;s.onerror=()=>fail(new Error("Could not load "+src));document.head.appendChild(s)});
loadContent()
  .then(()=>["js/core.js","js/art.js","js/ui.js"].reduce((p,f)=>p.then(()=>loadScript(f)),Promise.resolve()))
  .then(()=>renderHome())
  .catch(e=>{console.error(e);const a=document.getElementById("app");a.textContent="Could not load the lessons ("+e.message+"). Check your connection and reload.";a.style.cssText="padding:24px;font:16px/1.5 system-ui"});
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
</html>
