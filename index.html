  .catch(e=>{console.error(e);window.dispatchEvent(new Event('app-ready'));const a=document.getElementById("app");a.textContent="Could not load the lessons ("+e.message+"). Check your connection and reload.";a.style.cssText="padding:24px;font:16px/1.5 system-ui"});
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
