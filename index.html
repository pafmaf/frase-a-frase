<style>
/* Layout: phone column — sticky header, mascot hero card, zig-zag game map of unit coins, tactile full-screen exercise sessions */
:root{
  --bg:#E8EDFB; --bg-glow1:#D6E0FF; --bg-glow2:#FFE3D3; --surface:#FFFFFF; --surface-2:#F4F6FE;
  --ink:#18213D; --muted:#5A6588; --line:#D3DAEF; --line-deep:#BCC5E2;
  --btn:#3A5BE0; --btn-deep:#2238A8; --btn-hi:#5A79F2; --on-btn:#FFFFFF;
  --soft:#E0E6FD; --accent:#3A5BE0;
  --gold:#FFB627; --gold-deep:#D08600; --gold-hi:#FFD36B;
  --coral:#FF7A59;
  --ok:#1E9A5B; --ok-deep:#137043; --ok-soft:#DDF4E7;
  --bad:#DC463D; --bad-deep:#A12D26; --bad-soft:#FDE2E0;
  --lock:#C9D0E6; --lock-deep:#A9B2CE;
  --sc-sky:#CFE6FF; --sc-ground:#BFD0EE; --sc-wall:#FBE7D3; --sc-wood:#D19563; --sc-wood-d:#9E673F; --sc-metal:#D3DAE8; --sc-metal-d:#9AA4BE;
  --sc-glass:#E6F3FF; --sc-frame:#FFFFFF; --sc-win:#FFFFFF; --sc-build:#A9BCE6; --sc-sun:#FFC23F; --sc-moon:#DDE3F5; --sc-hill:#9DD8A8; --sc-hill2:#7CC48C;
  --sc-road:#5D6380; --sc-rail:#8A93AE; --sc-bubble:#FFFFFF; --sc-line:#C9D2EA; --sc-tag:#18213D; --sc-tagtext:#FFFFFF; --sc-steam:#FFFFFF; --sc-cup:#FFFFFF;
  --sc-board:#2E3A5E; --sc-boardtext:#FFFFFF; --sc-shirt:#5A6588; --sc-cloth:#FF9E86; --sc-plate:#FFFFFF; --sc-palace1:#F4C542; --sc-palace2:#E05A4A; --sc-star-o:0;
  --sc-crust:#E9A23B; --sc-custard:#FFE08A; --sc-crust-d:#A8611A; --c-skin:#F1C29B; --c-hair:#3B2A20;
  --br-food:#FF7A59; --br-travel:#3A9BE0; --br-people:#22A060; --br-life:#9B5DE5; --br-words:#E0548E;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 10px 30px -12px rgba(34,56,168,.35);
  /* character colors (same in both themes) */
  --c-ink:#1D1A33; --c-sun:#FFB627; --c-sun-deep:#F08A00; --c-cheek:#FF7A59; --c-fish:#7FA8E8; --c-fish-deep:#4C76C2; --c-belly:#E4EEFF; --c-white:#FFFFFF;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --f-phrase:"Literata",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1330; --bg-glow1:#1E2A6B; --bg-glow2:#3A1F3A; --surface:#1A2250; --surface-2:#141B42;
  --ink:#EEF1FF; --muted:#A4AED8; --line:#2D3874; --line-deep:#222B5E;
  --btn:#4D68EE; --btn-deep:#2A3CA6; --btn-hi:#6E86FF; --on-btn:#FFFFFF;
  --soft:#252F6E; --accent:#8CA2FF;
  --gold:#FFC23F; --gold-deep:#B57A06; --gold-hi:#FFDA80; --coral:#FF8C6E;
  --ok:#3DD68A; --ok-deep:#1E8A55; --ok-soft:#14392A;
  --bad:#FF6B62; --bad-deep:#B13B34; --bad-soft:#43202C;
  --lock:#333D78; --lock-deep:#252D5E;
  --shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 14px 30px -14px rgba(0,0,0,.7);
  --sc-sky:#18204A; --sc-ground:#262F62; --sc-wall:#2E2648; --sc-wood:#6E4A35; --sc-wood-d:#4E3424; --sc-metal:#59638E; --sc-metal-d:#3F4874;
  --sc-glass:#2C3B73; --sc-frame:#46528A; --sc-win:#FFD66B; --sc-build:#222A5A; --sc-sun:#F4E3A1; --sc-moon:#DDE3F5; --sc-hill:#2A5E4A; --sc-hill2:#1E4638;
  --sc-road:#1F2340; --sc-rail:#39416B; --sc-bubble:#F2F4FF; --sc-line:#8C96C4; --sc-tag:#FFD66B; --sc-tagtext:#18213D; --sc-steam:#C9D2EA; --sc-cup:#E8ECFA;
  --sc-board:#11162E; --sc-boardtext:#FFD66B; --sc-shirt:#8C96C4; --sc-cloth:#B85A48; --sc-plate:#DDE3F5; --sc-palace1:#C99A2E; --sc-palace2:#A8423A; --sc-star-o:1;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1330; --bg-glow1:#1E2A6B; --bg-glow2:#3A1F3A; --surface:#1A2250; --surface-2:#141B42;
  --ink:#EEF1FF; --muted:#A4AED8; --line:#2D3874; --line-deep:#222B5E;
  --btn:#4D68EE; --btn-deep:#2A3CA6; --btn-hi:#6E86FF; --on-btn:#FFFFFF;
  --soft:#252F6E; --accent:#8CA2FF;
  --gold:#FFC23F; --gold-deep:#B57A06; --gold-hi:#FFDA80; --coral:#FF8C6E;
  --ok:#3DD68A; --ok-deep:#1E8A55; --ok-soft:#14392A;
  --bad:#FF6B62; --bad-deep:#B13B34; --bad-soft:#43202C;
  --lock:#333D78; --lock-deep:#252D5E;
  --shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 14px 30px -14px rgba(0,0,0,.7);
  --sc-sky:#18204A; --sc-ground:#262F62; --sc-wall:#2E2648; --sc-wood:#6E4A35; --sc-wood-d:#4E3424; --sc-metal:#59638E; --sc-metal-d:#3F4874;
  --sc-glass:#2C3B73; --sc-frame:#46528A; --sc-win:#FFD66B; --sc-build:#222A5A; --sc-sun:#F4E3A1; --sc-moon:#DDE3F5; --sc-hill:#2A5E4A; --sc-hill2:#1E4638;
  --sc-road:#1F2340; --sc-rail:#39416B; --sc-bubble:#F2F4FF; --sc-line:#8C96C4; --sc-tag:#FFD66B; --sc-tagtext:#18213D; --sc-steam:#C9D2EA; --sc-cup:#E8ECFA;
  --sc-board:#11162E; --sc-boardtext:#FFD66B; --sc-shirt:#8C96C4; --sc-cloth:#B85A48; --sc-plate:#DDE3F5; --sc-palace1:#C99A2E; --sc-palace2:#A8423A; --sc-star-o:1;
  color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.backdrop{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(60vmax 40vmax at 100% 0%, var(--bg-glow2), transparent 60%),
    radial-gradient(70vmax 50vmax at 0% 30%, var(--bg-glow1), transparent 60%),
    var(--bg)}
.backdrop::after{content:"";position:absolute;inset:0;opacity:.35;
  background-image:radial-gradient(var(--line) 1.2px, transparent 1.4px);background-size:22px 22px}
.app{max-width:560px;margin:0 auto;padding-bottom:48px;position:relative}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* chunky 3D button */
.chunky{--f:var(--btn);--d:var(--btn-deep);--h:var(--btn-hi);
  border:0;border-radius:16px;padding:14px 20px;font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.01em;
  color:var(--on-btn);background:linear-gradient(180deg,var(--h),var(--f) 55%);box-shadow:0 5px 0 var(--d), 0 10px 18px -8px var(--d);
  transform:translateY(0);text-transform:uppercase}
.chunky:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--d)}
.chunky:disabled{--f:var(--lock);--d:var(--lock-deep);--h:var(--lock);color:var(--muted);cursor:default}
.chunky.ok{--f:var(--ok);--d:var(--ok-deep);--h:var(--ok)}
.chunky.bad{--f:var(--bad);--d:var(--bad-deep);--h:var(--bad)}
.chunky.gold{--f:var(--gold);--d:var(--gold-deep);--h:var(--gold-hi);color:var(--c-ink)}
.full{width:100%}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px 10px;
  background:linear-gradient(var(--bg) 70%, transparent)}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;line-height:1}
.brand em{font-style:normal;color:var(--coral)}
.hright{display:flex;gap:6px;align-items:center}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-family:var(--f-display);font-weight:800;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--on-btn);box-shadow:0 3px 0 var(--btn-deep)}
.icon-btn{border:0;background:var(--surface);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;box-shadow:var(--shadow)}
.icon-btn svg{width:19px;height:19px}

/* hero */
.hero{position:relative;background:linear-gradient(160deg,var(--surface),var(--surface-2));border-radius:26px;padding:18px;box-shadow:var(--shadow);margin-top:4px;
  display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:center;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:var(--soft);opacity:.7;z-index:0}
.hero > *{position:relative;z-index:1;min-width:0}
.hero .mascot{width:104px;height:104px}
.hero h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.15;text-wrap:balance}
.bubble{position:relative;display:inline-block;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:4px 10px;
  font-family:var(--f-phrase);font-weight:600;font-size:15px;margin-bottom:8px;box-shadow:0 3px 0 var(--line)}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;width:12px;height:12px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 6px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.chip svg{width:16px;height:16px}
.chip.fire svg{color:var(--coral)} .chip.star svg{color:var(--gold)} .chip.due svg{color:var(--accent)}
.lvl{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-weight:700}
.lvl .badge{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--c-ink);border-radius:10px;padding:2px 8px;font-family:var(--f-display);box-shadow:0 2px 0 var(--gold-deep)}
.xpbar{flex:1;height:10px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--coral));border-radius:9px}

/* skill tree */
.map-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:28px 4px 4px;flex-wrap:wrap}
.map-head h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.map-head small{color:var(--muted);font-size:13px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:0 4px 6px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.tree{position:relative;margin-top:6px}
.links{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.links path{fill:none;stroke:var(--line-deep);stroke-width:4;stroke-linecap:round;stroke-dasharray:2 9;vector-effect:non-scaling-stroke}
.links path.open{stroke:var(--accent);stroke-dasharray:none;opacity:.55}
.links path.done{stroke:var(--gold);stroke-dasharray:none;stroke-width:5}
.node{position:absolute;width:86px;margin-left:-43px;display:flex;flex-direction:column;align-items:center}
.coin-wrap{position:relative}
.ring{width:72px;height:72px;border-radius:50%;padding:5px;background:conic-gradient(var(--br) calc(var(--p) * 1%), var(--line) 0);display:grid;place-items:center}
.coin{width:62px;height:62px;border-radius:50%;border:0;display:grid;place-items:center;color:var(--on-btn);
  background:radial-gradient(circle at 35% 28%, var(--btn-hi), var(--btn) 60%);box-shadow:0 5px 0 var(--btn-deep), 0 10px 18px -8px var(--btn-deep)}
.coin svg{width:28px;height:28px}
.coin:active{transform:translateY(4px);box-shadow:0 1px 0 var(--btn-deep)}
.node.done .coin{background:radial-gradient(circle at 35% 28%, var(--gold-hi), var(--gold) 60%);box-shadow:0 5px 0 var(--gold-deep), 0 10px 18px -8px var(--gold-deep);color:var(--c-ink)}
.node.locked .coin{background:var(--lock);box-shadow:0 5px 0 var(--lock-deep);color:var(--muted)}
.node.locked .ring{background:var(--line)}
.node.shake .coin{animation:shake .4s}
.node .scen{position:absolute;right:-6px;top:-4px;background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--c-ink);font-family:var(--f-display);font-weight:800;font-size:10px;letter-spacing:.06em;border-radius:7px;padding:1px 5px;box-shadow:0 2px 0 var(--gold-deep);z-index:2}
.side-mascot{position:absolute;top:-20px;width:40px;height:40px;z-index:2;pointer-events:none}
.side-mascot.r{right:-16px} .side-mascot.l{left:-16px;transform:scaleX(-1)}
.label{margin-top:8px;text-align:center;width:100%}
.label b{display:block;font-family:var(--f-display);font-weight:800;font-size:13px;line-height:1.15;text-wrap:balance}
.label span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.node.locked .label{opacity:.55}
.unit-sheet .lv{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--coral)}
.unit-sheet h3{font-size:24px;line-height:1.15}
.unit-sheet .desc{margin:0;color:var(--muted)}
.unit-sheet .preview{display:grid;gap:6px;margin:0;padding:12px 14px;background:var(--surface-2);border-radius:14px;list-style:none}
.unit-sheet .preview li{font-family:var(--f-phrase);font-size:15px}
.unit-sheet .preview li span{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted)}
.needs{font-size:14px;color:var(--muted);margin:0}

/* session */
.session{display:flex;flex-direction:column;min-height:calc(100vh - 40px)}
.s-top{display:flex;align-items:center;gap:12px;padding-block:12px 16px}
.close{border:0;background:none;padding:6px;color:var(--muted);font-size:20px;line-height:1}
.pbar{flex:1;height:16px;border-radius:12px;background:var(--surface);box-shadow:inset 0 2px 3px rgba(0,0,0,.12);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:12px;background:linear-gradient(180deg,var(--ok),var(--ok-deep));position:relative;transition:width .4s cubic-bezier(.3,1.4,.5,1)}
.pbar i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:4px;background:rgba(255,255,255,.4)}
.combo{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-display);font-weight:800;color:var(--coral);font-variant-numeric:tabular-nums;min-width:44px}
.combo svg{width:20px;height:20px}
.combo.pop{animation:pop .4s}
.q-head{display:flex;gap:12px;align-items:flex-end;margin-bottom:14px}
.q-head .mini{width:70px;height:70px;flex:none}
.q-head .qt{min-width:0}
.kind{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:800;font-family:var(--f-display)}
.prompt{font-family:var(--f-display);font-weight:800;font-size:21px;margin:2px 0 0;line-height:1.2;text-wrap:balance}
.stage{background:var(--surface);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.phrase{font-family:var(--f-phrase);font-weight:600;font-size:26px;line-height:1.3;margin:0;text-wrap:balance}
.phrase .gap{display:inline-block;min-width:3.2em;border-bottom:4px dashed var(--gold);height:1em;vertical-align:-2px}
.en{color:var(--muted);font-size:16px;margin-top:8px}
.audio-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.play{display:inline-flex;align-items:center;gap:7px;border:0;background:var(--soft);color:var(--accent);font-weight:700;border-radius:999px;padding:9px 15px;box-shadow:0 3px 0 var(--line)}
.play:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.play svg{width:18px;height:18px}
.big-play{width:104px;height:104px;border-radius:50%;border:0;color:var(--on-btn);display:grid;place-items:center;margin:4px auto 6px;
  background:radial-gradient(circle at 35% 28%, var(--btn-hi), var(--btn) 60%);box-shadow:0 7px 0 var(--btn-deep), 0 14px 24px -10px var(--btn-deep)}
.big-play:active{transform:translateY(6px);box-shadow:0 1px 0 var(--btn-deep)}
.big-play svg{width:44px;height:44px}
.big-play.talking{animation:pulse 1s ease-in-out infinite}
.center{text-align:center}
.opts{display:grid;gap:11px;margin-top:16px}
.opt{text-align:left;border:2px solid var(--line);border-bottom-width:5px;background:var(--surface);border-radius:16px;padding:13px 15px;font-size:16px;line-height:1.35;display:flex;gap:12px;align-items:flex-start}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted);font-weight:800}
.opt.tgt{font-family:var(--f-phrase);font-size:17px}
.opt:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px;margin-top:3px}
.opt.right{border-color:var(--ok);background:var(--ok-soft);animation:pop .35s}
.opt.right .k{border-color:var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}
.opt:disabled{cursor:default}
.opts.words{grid-template-columns:1fr 1fr}
.words .opt{font-family:var(--f-phrase);justify-content:center;text-align:center}
.words .opt .k{display:none}

.answer-line{min-height:70px;margin-top:18px;padding:10px 4px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;
  background:repeating-linear-gradient(transparent 0 53px, var(--line) 53px 55px)}
.answer-line.right .tile-w{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.answer-line.wrong{animation:shake .4s}
.answer-line.wrong .tile-w{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.placeholder{color:var(--muted);font-size:14px;align-self:center;padding-left:4px}
.bank{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px;justify-content:center}
.tile-w{font-family:var(--f-phrase);font-weight:500;font-size:18px;border:2px solid var(--line);border-bottom-width:5px;background:var(--surface);border-radius:12px;padding:7px 13px;min-height:46px}
.tile-w:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.bank .tile-w:disabled{background:var(--line);color:transparent;border-color:var(--line);cursor:default}
.answer-line .tile-w{animation:drop .22s ease-out}

.feedback{margin-top:auto;padding-top:18px}
.fb{border-radius:22px;padding:14px 16px 16px;display:grid;gap:6px;animation:rise .28s cubic-bezier(.3,1.3,.5,1)}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--bad-soft)}
.fb-top{display:flex;align-items:center;gap:10px}

 {u:0,l:'es',t:'¡Hola! Perdona, ¿eres el amigo de Lucía? Ella me ha dicho que llegabas hoy. Yo soy Marta, su compañera de piso. Lucía todavía está en el trabajo, pero vuelve sobre las siete.',

function nextState(c,g){ // g: 0 again,1 hard,2 good,3 easy
  c={ef:2.5,iv:0,reps:0,lapses:0,...c};
  const now=Date.now();
  if(g===0)return {...c,reps:0,iv:0,lapses:c.lapses+1,ef:Math.max(1.3,c.ef-.2),due:now+MIN};
  let iv,ef=c.ef;
  if(g===1){iv=c.reps===0?1:Math.max(c.iv+1,Math.round(c.iv*1.2));ef=Math.max(1.3,ef-.15)}
  else if(g===2){iv=c.reps===0?1:c.reps===1?3:Math.round(c.iv*ef)}
  else{iv=c.reps===0?4:Math.round(Math.max(c.iv,1)*ef*1.3);ef+=.15}
  return {...c,ef,reps:c.reps+1,iv,due:now+iv*DAY};
}

const hasTTS='speechSynthesis' in window;
let voices=[];
function loadVoices(){if(!hasTTS)return;try{voices=speechSynthesis.getVoices()}catch(e){voices=[]}}

const langVoices=(l=st.lang)=>voices.filter(v=>v.lang.toLowerCase().replace('_','-').startsWith(l));
function pickVoice(l=st.lang){
  const vs=langVoices(l),code=LANGS[l].code.toLowerCase();
  return vs.find(v=>v.name===st.voice[l])||vs.find(v=>v.lang.toLowerCase().replace('_','-')===code)||vs[0]||null;
}
let ttsUnlocked=false,lastUtter=null,ttsLog='not tried yet';
function unlockTTS(){

function ttsSpeak(text,slow=st.slow){
  if(!hasTTS){ttsLog='speechSynthesis missing';return}
  try{
    if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();
    speechSynthesis.resume();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=LANGS[st.lang].code;const v=pickVoice();if(v)u.voice=v;
    u.rate=slow?.62:.95;u.volume=1;
    lastUtter=u; // keep a reference, some browsers drop it otherwise
    const bp=document.querySelector('.big-play');
    u.onstart=()=>{ttsLog='playing ('+(v?v.name:'default voice')+')';bp&&bp.classList.add('talking')};
    u.onend=()=>{bp&&bp.classList.remove('talking')};
    u.onerror=e=>{bp&&bp.classList.remove('talking');
      if(e.error==='interrupted'||e.error==='canceled')return;
      ttsLog='error: '+e.error;toast('Device speech unavailable here ('+e.error+'). Recorded voices fix this: see Settings.')};
    speechSynthesis.speak(u);
    ttsLog='queued, '+voices.length+' voices on device';
  }catch(e){ttsLog='exception: '+e.message;toast('Audio failed: '+e.message)}
}
/* recorded audio, described by audio/manifest.json
   v2 (several voices): {"ext":"m4a","voices":{"es":{"female":["0","1","g0"],"male":[...]},"pt":{...}}}
                        -> audio/<lang>/<voice>/<id>.<ext>
   v1 (one voice):      {"ext":"m4a","es":["0","1"],"pt":[...]} -> audio/<lang>/<id>.<ext> */
let manifest=null,curAudio=null,warnedTTS=false;
function parseManifest(m){
  const out={ext:/^[a-z0-9]{2,4}$/.test(m.ext||'')?m.ext:'m4a',voices:{es:{},pt:{}}};
  for(const l of ['es','pt']){
    if(m.voices&&m.voices[l])for(const [v,ids] of Object.entries(m.voices[l])){if(/^[a-z0-9_-]{1,24}$/i.test(v)&&Array.isArray(ids))out.voices[l][v]=new Set(ids.map(String))}
    else if(Array.isArray(m[l]))out.voices[l]['']=new Set(m[l].map(String));
  }
  return out;
}
fetch('audio/manifest.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(m=>{if(m){manifest=parseManifest(m);if(!session&&!sheetOpen)renderHome()}}).catch(()=>{});
const recVoices=(l=st.lang)=>manifest?Object.keys(manifest.voices[l]).filter(v=>manifest.voices[l][v].size):[];
const recorded=(l=st.lang)=>Math.max(0,...recVoices(l).map(v=>manifest.voices[l][v].size));
function clipFor(id){
  const l=st.lang,key=String(id),has=recVoices(l).filter(v=>manifest.voices[l][v].has(key));
  if(!has.length)return null;
  const pref=st.recVoice[l]||'mix';
  const v=pref==='mix'?has[[...key].reduce((a,c)=>a+c.charCodeAt(0),0)%has.length]:has.includes(pref)?pref:has[0];

}
const audioLabel=()=>{const v=recVoices();return v.length?`recorded ${v.filter(Boolean).length>1?v.length+' voices':'voice'} · ${recorded()} clips`:'device speech'};
function speak(id,slow=st.slow){
  const bp=document.querySelector('.big-play');
  if(curAudio){try{curAudio.pause()}catch(e){}curAudio=null}
  const clip=manifest&&clipFor(id);

      a.play().then(()=>{ttsLog='recorded clip playing'}).catch(e=>{ttsLog='clip failed: '+e.name;ttsSpeak(textOf(id),slow)});
      return;
    }catch(e){ttsLog='clip error: '+e.message}
  }
  ttsSpeak(textOf(id),slow);

  }
}
let actx=null;
function sfx(kind){
  if(!st.sfx)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const notes=kind==='ok'?[660,880]:kind==='bad'?[220,165]:kind==='tap'?[520]:[523,659,784,1046];

    });

}

function bubble(x,y,text,delay=0,side='l'){
  const w=tw(text),tx=Math.max(4,Math.min(356-w,side==='l'?x:x-w));
  return `<g class="sc-bubble" style="animation-delay:${delay}s"><rect x="${tx}" y="${y}" width="${w}" height="22" rx="11" fill="var(--sc-bubble)" stroke="var(--sc-line)" stroke-width="1.5"/>
    <path d="M${side==='l'?tx+14:tx+w-14} ${y+21} l${side==='l'?-4:4} 7 l${side==='l'?10:-10} -7z" fill="var(--sc-bubble)"/>
    <text x="${tx+w/2}" y="${y+15}" text-anchor="middle" class="sc-text">${esc(text)}</text></g>`;
}
function tag(x,y,text){
  const w=tw(text)-4;
  return `<g class="sc-tag"><rect x="${x-w/2}" y="${y}" width="${w}" height="18" rx="6" fill="var(--sc-tag)"/><text x="${x}" y="${y+13}" text-anchor="middle" class="sc-tagtext">${esc(text)}</text></g>`;
}
function npc(x,y,shirt,o={}){
  const skin=o.skin||'var(--c-skin)',hair=o.hair||'var(--c-hair)';
  const arm=o.wave?`<g class="sc-wave" style="transform-origin:${x+14}px ${y+2}px"><rect x="${x+12}" y="${y-14}" width="7" height="20" rx="3.5" fill="${shirt}"/><circle cx="${x+15.5}" cy="${y-16}" r="4.5" fill="${skin}"/></g>`:'';
  return `<g class="${o.cls||'sc-bob'}">${arm}
    <rect x="${x-16}" y="${y-6}" width="32" height="36" rx="14" fill="${shirt}"/>
    ${o.apron?`<rect x="${x-10}" y="${y+2}" width="20" height="26" rx="5" fill="${o.apron}"/>`:''}
    <circle cx="${x}" cy="${y-19}" r="14" fill="${skin}"/>
    <path d="M${x-14} ${y-21} Q${x} ${y-42} ${x+14} ${y-21} Q${x+7} ${y-30} ${x} ${y-30} Q${x-7} ${y-30} ${x-14} ${y-21}z" fill="${hair}"/>
    <g class="eyes" style="transform-origin:${x}px ${y-18}px"><circle cx="${x-5}" cy="${y-18}" r="1.9" fill="var(--c-ink)"/><circle cx="${x+5}" cy="${y-18}" r="1.9" fill="var(--c-ink)"/></g>
    <path d="M${x-5} ${y-11} Q${x} ${y-7} ${x+5} ${y-11}" stroke="var(--c-ink)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    ${o.hat||''}</g>`;
}

const base=(wall)=>`<rect width="360" height="120" fill="${wall||'var(--sc-sky)'}"/>${wall?'':stars()}<rect y="96" width="360" height="24" fill="var(--sc-ground)"/>`;

/* ---------- sessions ---------- */
let session=null;
const LESSON_TYPES=['meaning','listen','build','translate','gap','build'];
function typeFor(c){
  if(!c||c.reps<=1)return shuffle(['meaning','listen','build'])[0];
  if(c.reps===2)return shuffle(['translate','build'])[0];
  return shuffle(['listen','translate','gap','build','build'])[0];
}
function newSession(mode,items,unit){session={mode,unit,items,i:0,right:0,asked:0,combo:0,best:0,xp:0}}
function startUnit(u){
  const inf=unitInfo(u),cs=cards();
  const fresh=inf.ids.filter(i=>!cs[i]);
  const cold=gistsFor(u).map(g=>({id:g.id,type:'cold'}));
  if(fresh.length)newSession('lesson',[...fresh.map(id=>({id,type:'intro'})),...shuffle(fresh).map((id,i)=>({id,type:LESSON_TYPES[i%6]})),...cold],u);
  else newSession('practice',[...shuffle(inf.ids).map(id=>({id,type:typeFor(cs[id])})),...cold],u);
  renderItem();
}
function startReview(){
  const items=shuffle(dueList()).slice(0,20).map(id=>({id,type:typeFor(cards()[id])}));
  const pool=UNITS.map((_,u)=>u).filter(u=>unitInfo(u).seen).flatMap(u=>gistsFor(u));
  if(pool.length)items.splice(Math.min(items.length,4+Math.floor(Math.random()*4)),0,{id:pick(pool).id,type:'cold'});
  newSession('review',items);
  renderItem();
}
function distractSentences(id,field){
  const u=S[id][0],get=i=>field==='en'?S[i][1]:tgt(i);
  const same=shuffle(unitIds(u).filter(i=>i!==id)),other=shuffle(allIds().filter(i=>S[i][0]!==u));
  const out=[],seen=new Set([get(id)]);
  for(const i of [...same.slice(0,2),...other,...same.slice(2)]){if(out.length>=3)break;const t=get(i);if(!seen.has(t)){seen.add(t);out.push(t)}}
  return out;
}
const clean=w=>w.replace(/[¡!¿?.,]/g,'');
function gapFor(id){
  const toks=tgt(id).split(/\s+/);
  let best=-1;
  toks.forEach((t,i)=>{const c=clean(t);if(c.length<3)return;if(i>0&&/^[A-ZÁÉÍÓÚ]/.test(c))return;if(best<0||c.length>clean(toks[best]).length)best=i});
  if(best<0)best=0;
  const ans=clean(toks[best]);
  const pool=[...new Set(allIds().flatMap(i=>tgt(i).split(/\s+/).map(clean)).filter(w=>w.length>=3&&w.toLowerCase()!==ans.toLowerCase()&&!/^[A-ZÁÉÍÓÚ]/.test(w)))];
  const near=shuffle(pool.filter(w=>Math.abs(w.length-ans.length)<=3));
  const opts=shuffle([ans,...(near.length>=3?near:shuffle(pool)).slice(0,3)]);
  const html=toks.map((t,i)=>i===best?esc(t.replace(ans,'\u0000')).replace('\u0000','<span class="gap"></span>'):esc(t)).join(' ');
  return {ans,opts,html};
}

    answer=EN;opts=shuffle([EN,...distractSentences(id,'en')]);

    answer=g.ans;opts=g.opts;
  }
  app.innerHTML=`<div class="session">${sessionTop()}${body}
    <div class="opts ${it.type==='gap'?'words':''}">${opts.map((o,k)=>`<button class="opt ${optCls}" data-o="${esc(o)}"><span class="k">${k+1}</span><span>${esc(o)}</span></button>`).join('')}</div>
    <div class="feedback" id="fb"></div></div>`;
  $('#quit').onclick=renderHome;bindAudio(id);
  if(it.type==='listen')speak(id);
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answerWith(b,answer,it));
}
function answerWith(btn,answer,it){
  const ok=btn.dataset.o===answer;
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.o===answer)b.classList.add('right')});
  if(!ok)btn.classList.add('wrong');
  finish(ok,it);
}
function renderBuild(it){
  const id=it.id,T=tgt(id),EN=S[id][1];
  const words=T.split(/\s+/).map(clean).filter(Boolean);
  const pool=[...new Set(allIds().flatMap(i=>i===id?[]:tgt(i).split(/\s+/).map(clean)))].filter(w=>w.length>=2&&!words.some(x=>x.toLowerCase()===w.toLowerCase()));
  const extra=shuffle(pool).slice(0,words.length<4?2:3);
  const bank=shuffle([...words,...extra]).map((w,k)=>({w,k}));
  let picked=[];
  $('#app').innerHTML=`<div class="session">${sessionTop()}
    ${qHead('Listen &amp; build','Tap the words in the order you hear them')}
    <div class="stage center"><button class="big-play" data-say="0" aria-label="Play">${ICON.play}</button>
      <div class="audio-row" style="justify-content:center"><button class="play" data-say="1">${ICON.slow}Slow</button><button class="play" id="hint">Show meaning</button></div>
      <div class="en" id="hintTxt" hidden>${esc(EN)}</div>
      ${hasTTS?'':'<p class="note">Audio is not available here. Build this: '+esc(EN)+'</p>'}</div>
    <div class="answer-line" id="line" aria-live="polite"></div>
    <div class="bank" id="bank"></div>
    <div class="feedback" id="fb"><button class="chunky full" id="check" disabled>Check</button></div></div>`;
  $('#quit').onclick=renderHome;bindAudio(id);speak(id);
  $('#hint').onclick=()=>{$('#hintTxt').hidden=false;$('#hint').hidden=true};
  const draw=()=>{
    $('#line').innerHTML=picked.length?picked.map(p=>`<button class="tile-w" data-k="${p.k}">${esc(p.w)}</button>`).join(''):'<span class="placeholder">Your sentence appears here</span>';
    $('#bank').innerHTML=bank.map(p=>`<button class="tile-w" data-b="${p.k}" ${picked.includes(p)?'disabled':''}>${esc(p.w)}</button>`).join('');
    $('#line').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{sfx('tap');picked=picked.filter(p=>p.k!==+b.dataset.k);draw()});
    $('#bank').querySelectorAll('[data-b]:not(:disabled)').forEach(b=>b.onclick=()=>{sfx('tap');picked.push(bank.find(p=>p.k===+b.dataset.b));draw()});
    $('#check').disabled=!picked.length;
  };
  draw();
  $('#check').onclick=()=>{
    const ok=picked.map(p=>p.w.toLowerCase()).join(' ')===words.map(w=>w.toLowerCase()).join(' ');
    document.querySelectorAll('.tile-w').forEach(b=>b.disabled=true);
    $('#line').classList.add(ok?'right':'wrong');
    finish(ok,it);
  };
}
function renderCold(it){
  const g=gistById(it.id),id=it.id,opts=shuffle([g.a,...g.d]);
  let peeked=false;
  $('#app').innerHTML=`<div class="session">${sessionTop()}
    ${qHead('Cold water','Listen to the whole thing. Get the gist.')}
    <div class="stage center cold-stage"><span class="intro-tag cold-tag">Natural speed · new words</span>
      <button class="big-play" data-say="0" aria-label="Play">${ICON.play}</button>
      <div class="audio-row" style="justify-content:center"><button class="play" data-say="1">${ICON.slow}Slow</button><button class="play" id="peek">Show transcript</button></div>
      <p class="transcript" id="tx" hidden>${esc(g.t)}</p>
      <p class="note" id="peekNote" hidden>Transcript shown: half XP for this one.</p></div>
    <p class="prompt cold-q">${esc(g.q)}</p>
    <div class="opts">${opts.map((o,k)=>`<button class="opt" data-o="${esc(o)}"><span class="k">${k+1}</span><span>${esc(o)}</span></button>`).join('')}</div>
    <div class="feedback" id="fb"></div></div>`;
  $('#quit').onclick=renderHome;bindAudio(id);speak(id,false);
  $('#peek').onclick=()=>{peeked=true;$('#tx').hidden=false;$('#peekNote').hidden=false;$('#peek').hidden=true};
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const ok=b.dataset.o===g.a;
    document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.o===g.a)x.classList.add('right')});
    if(!ok)b.classList.add('wrong');
    session.asked++;let gain=0;
    if(ok){session.right++;session.combo++;session.best=Math.max(session.best,session.combo);gain=peeked?12:25;session.xp+=gain;st.xp[st.lang]+=gain;save()}
    else session.combo=0;
    sfx(ok?'ok':'bad');
    const cb=$('#combo');if(cb){cb.style.visibility=session.combo>1?'visible':'hidden';cb.innerHTML=ICON.fire+session.combo}
    setSceneMood(ok?'happy':'sad');
    $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}">
      <div class="fb-top">${mascot(st.lang,ok?'happy':'sad','mini')}<div><strong>${ok?'You got the gist!':'Not quite. Read along and listen again.'}</strong><small>${esc(LANGS[st.lang].buddy)}: ${esc(pick(LINES[st.lang][ok?'happy':'sad']))}</small></div>${ok?`<span class="xp-pop">+${gain} XP</span>`:''}</div>
      <p class="transcript" style="margin:0">${esc(g.t)}</p><div class="en" style="margin:0">${esc(g.en)}</div>
      <div class="audio-row" style="margin-top:4px"><button class="play" data-say="0">${ICON.play}Play</button><button class="play" data-say="1">${ICON.slow}Slow</button></div>
      <button class="chunky ${ok?'ok':'bad'} full" id="next">Continue</button></div>`;
    bindAudio(id);
    $('#next').onclick=()=>{sfx('tap');session.i++;renderItem()};
    $('#fb').scrollIntoView({behavior:'smooth',block:'end'});
  });
}
function finish(ok,it){
  const id=it.id,T=tgt(id);
  session.asked++;
  let gain=0;
  if(ok){session.right++;session.combo++;session.best=Math.max(session.best,session.combo);gain=10+Math.min(session.combo-1,5)*2;session.xp+=gain;st.xp[st.lang]+=gain;save()}
  else session.combo=0;
  sfx(ok?'ok':'bad');
  const cb=$('#combo');if(cb){cb.style.visibility=session.combo>1?'visible':'hidden';cb.innerHTML=ICON.fire+session.combo;if(ok){cb.classList.remove('pop');void cb.offsetWidth;cb.classList.add('pop')}}
  setSceneMood(ok?'happy':'sad');
  speak(id);
  const graded=session.mode!=='practice',c=cards()[id];
  let actions='';
  if(!ok){
    if(graded){cards()[id]=nextState(c,0);save()}
    if(!it.retry)session.items.push({id,type:it.type==='listen'?'meaning':it.type==='build'?'translate':it.type,retry:true});
    actions=`<button class="chunky bad full" id="next">Continue</button>`;
  }else if(graded){
    const pv=[1,2,3].map(g=>nextState(c,g).iv);
    actions=`<div class="grades">
      <button class="chunky grade" data-g="1" style="--f:var(--surface);--h:var(--surface);--d:var(--line);color:var(--ink)">Hard<small>${fmtIv(pv[0])}</small></button>
      <button class="chunky grade ok" data-g="2">Good<small>${fmtIv(pv[1])}</small></button>
      <button class="chunky grade" data-g="3" style="--f:var(--surface);--h:var(--surface);--d:var(--line);color:var(--ink)">Easy<small>${fmtIv(pv[2])}</small></button></div>`;
  }else actions=`<button class="chunky ok full" id="next">Continue</button>`;
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}">
    <div class="fb-top">${mascot(st.lang,ok?'happy':'sad','mini')}<div><strong>${ok?(session.combo>2?session.combo+' in a row!':'Correct'):'Not quite'}</strong><small>${esc(LANGS[st.lang].buddy)}: ${esc(pick(LINES[st.lang][ok?'happy':'sad']))}</small></div>${ok?`<span class="xp-pop">+${gain} XP</span>`:''}</div>
    <p class="phrase">${esc(T)}</p><div class="en" style="margin:0">${esc(S[id][1])}</div>
    <div class="audio-row" style="margin-top:4px">${audioRow().replace(/^<div class="audio-row">|<\/div>$/g,'')}</div>${actions}</div>`;
  bindAudio(id);
  const adv=()=>{sfx('tap');session.i++;renderItem()};
  const n=$('#next');if(n)n.onclick=adv;
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{cards()[id]=nextState(cards()[id],+b.dataset.g);save();adv()});
  $('#fb').scrollIntoView({behavior:'smooth',block:'end'});
}
function renderDone(){
  const today=new Date().toISOString().slice(0,10),yest=new Date(Date.now()-DAY).toISOString().slice(0,10);
  if(st.streak.last!==today){st.streak={last:today,n:st.streak.last===yest?st.streak.n+1:1};save()}
  const pct=session.asked?Math.round(session.right/session.asked*100):100;
  const next=Object.values(cards()).map(c=>c.due).filter(d=>d>Date.now()).sort((a,b)=>a-b)[0];
  const nextTxt=next?(next-Date.now()<DAY?'later today':new Date(next).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'})):'';
  const title=session.mode==='cold'?'Out of the cold water!':session.mode==='lesson'?`${esc(uTxt(session.unit,'t'))} cleared!`:session.mode==='review'?'Review done!':'Practice done!';
  $('#app').innerHTML=`<div class="done-wrap">
    ${mascot(st.lang,'cheer','big')}
    <div class="bubble" style="margin:0">${esc(pick(LINES[st.lang].done))}</div>
    <h2>${title}</h2>
    <div class="done-stats">
      <div class="dstat g"><b>+${session.xp}</b><span>XP</span></div>
      <div class="dstat o"><b>${pct}%</b><span>Accuracy</span></div>
      <div class="dstat"><b>${session.best}</b><span>Best combo</span></div>
    </div>
    ${nextTxt?`<p class="note" style="margin:0 0 14px">Next review ${nextTxt}</p>`:''}
    <button class="chunky" id="home">Back to the path</button></div>`;
  $('#home').onclick=()=>{sfx('tap');renderHome()};
  sfx('done');confetti();
}

/* ---------- confetti ---------- */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=$('#confetti'),ctx=cv.getContext('2d');cv.hidden=false;
  const W=cv.width=innerWidth*devicePixelRatio,H=cv.height=innerHeight*devicePixelRatio;
  const css=getComputedStyle(document.documentElement);
  const cols=['--gold','--coral','--btn','--ok','--c-fish'].map(v=>css.getPropertyValue(v).trim());
  const ps=Array.from({length:120},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*16*devicePixelRatio,vy:(-Math.random()*16-6)*devicePixelRatio,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,s:(6+Math.random()*6)*devicePixelRatio,c:pick(cols)}));
  let t=0;
  (function loop(){
    ctx.clearRect(0,0,W,H);t++;
    ps.forEach(p=>{p.vy+=.45*devicePixelRatio;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});
    if(t<160)requestAnimationFrame(loop);else{ctx.clearRect(0,0,W,H);cv.hidden=true}
  })();
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(!session||e.target.tagName==='SELECT')return;
  const n=+e.key;
  if(n>=1&&n<=4){const o=document.querySelectorAll('.opt:not(:disabled)')[n-1];if(o)o.click()}
  if(e.key===' '){const p=document.querySelector('[data-say="0"]');if(p){e.preventDefault();p.click()}}
  if(e.key==='Enter'){const nx=$('#next')||document.querySelector('[data-g="2"]')||$('#check');if(nx&&!nx.disabled)nx.click()}
});

/* ---------- settings ---------- */
let sheetOpen=false,confirmReset=false;
function openSheet(){sheetOpen=true;confirmReset=false;$('#sheet').hidden=false;$('#scrim').hidden=false;renderSheet()}
function closeSheet(){sheetOpen=false;$('#sheet').hidden=true;$('#scrim').hidden=true;if(!session)renderHome()}
$('#scrim').onclick=closeSheet;
function renderSheet(){
  const vs=langVoices(),cur=pickVoice();
  $('#sheet').innerHTML=`<div class="sheet-in"><h3>Settings · ${LANGS[st.lang].native}</h3>
   <div class="row"><label for="voice">Device voice (fallback)</label>
    ${vs.length?`<select id="voice">${vs.map(v=>`<option ${cur&&v.name===cur.name?'selected':''}>${esc(v.name)}</option>`).join('')}</select>`
      :`<p class="note" style="margin:0">${hasTTS?'No '+LANGS[st.lang].name+' voice found. Install one in your phone’s text-to-speech settings for natural audio.':'This browser has no speech output.'}</p>`}</div>
   ${recVoices().length>1?`<div class="row"><label for="recSel">Recorded voice</label>
    <select id="recSel"><option value="mix" ${st.recVoice[st.lang]==='mix'?'selected':''}>Mix (alternate per sentence)</option>${recVoices().map(v=>`<option value="${esc(v)}" ${st.recVoice[st.lang]===v?'selected':''}>${esc(v.charAt(0).toUpperCase()+v.slice(1))}</option>`).join('')}</select></div>`:''}
   <div class="row"><label for="speed">Default speed</label>
    <select id="speed"><option value="n" ${!st.slow?'selected':''}>Natural</option><option value="s" ${st.slow?'selected':''}>Slow</option></select></div>
   <div class="row"><label for="themeSel">Theme</label>
    <select id="themeSel">${THEMES.map(x=>`<option value="${x}" ${st.theme===x?'selected':''}>${({auto:'Follow my phone',light:'Light',dark:'Dark'})[x]}</option>`).join('')}</select></div>
   <div class="row"><label for="sfxSel">Game sounds</label>
    <select id="sfxSel"><option value="1" ${st.sfx?'selected':''}>On</option><option value="0" ${!st.sfx?'selected':''}>Off</option></select></div>
   <button class="ghost" id="test">Test voice</button>
   <p class="note" id="diag" style="margin:0">Audio check: ${recorded()?recorded()+' recorded clips':'no recorded clips yet'} · ${hasTTS?'device speech supported':'device speech not supported'} · ${voices.length} voices · ${vs.length} ${LANGS[st.lang].name} · ${esc(ttsLog)}</p>
   <button class="ghost danger" id="reset">${confirmReset?'Tap again to erase '+LANGS[st.lang].name+' progress':'Reset '+LANGS[st.lang].name+' progress'}</button>
   <button class="chunky" id="closeS">Done</button></div>`;
  const vSel=$('#voice');if(vSel)vSel.onchange=()=>{st.voice[st.lang]=vSel.value;save()};
  $('#speed').onchange=e=>{st.slow=e.target.value==='s';save()};
  $('#sfxSel').onchange=e=>{st.sfx=e.target.value==='1';save()};
  const rs=$('#recSel');if(rs)rs.onchange=e=>{st.recVoice[st.lang]=e.target.value;save();speak(0)};
  $('#themeSel').onchange=e=>{st.theme=e.target.value;applyTheme();save()};
  $('#test').onclick=()=>{loadVoices();speak(0);setTimeout(()=>{if(sheetOpen)renderSheet()},1200)};
  $('#reset').onclick=()=>{if(confirmReset){st.cards[st.lang]={};st.xp[st.lang]=0;save();closeSheet()}else{confirmReset=true;renderSheet()}};
  $('#closeS').onclick=closeSheet;
}

renderHome();
</script>
